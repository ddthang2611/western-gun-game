    31.7,95.5 
    41.8,76.2 
    23.3,64.2 
    42.2,52.8 
    32.8,33.1 
    54.5,35.6
  " fill="url(#goldGradVite)" stroke="#5d4037" stroke-width="2" stroke-linejoin="round" filter="url(#badgeShadowVite)"/>

  <circle cx="64.0" cy="16.0" r="3.5" fill="url(#goldGradVite)" stroke="#3e2723" stroke-width="1"/>
  <circle cx="95.2" cy="33.1" r="3.5" fill="url(#goldGradVite)" stroke="#3e2723" stroke-width="1"/>
  <circle cx="104.7" cy="64.2" r="3.5" fill="url(#goldGradVite)" stroke="#3e2723" stroke-width="1"/>
  <circle cx="96.3" cy="95.5" r="3.5" fill="url(#goldGradVite)" stroke="#3e2723" stroke-width="1"/>
