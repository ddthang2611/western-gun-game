<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Western Gun Sheriff Star Icon replacing default Vite -->
  <defs>
    <radialGradient id="starRingVite" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d2314"/>
      <stop offset="70%" stop-color="#24140a"/>
      <stop offset="100%" stop-color="#0f0703"/>
    </radialGradient>
    <linearGradient id="goldGradVite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4cc"/>
      <stop offset="25%" stop-color="#ffd54f"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="75%" stop-color="#ff8f00"/>
      <stop offset="100%" stop-color="#bf6000"/>
    </linearGradient>
    <linearGradient id="metalRimVite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#8d6e63"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </linearGradient>
    <filter id="badgeShadowVite" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <circle cx="64" cy="64" r="60" fill="url(#starRingVite)" stroke="url(#metalRimVite)" stroke-width="4" filter="url(#badgeShadowVite)"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="#d7ccc8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>

