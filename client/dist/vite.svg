  <circle cx="32.8" cy="33.1" r="3.5" fill="url(#goldGradVite)" stroke="#3e2723" stroke-width="1"/>

  <circle cx="64" cy="64" r="19" fill="#2d170c" stroke="url(#goldGradVite)" stroke-width="2"/>
  <circle cx="64" cy="64" r="16" fill="none" stroke="#ffe082" stroke-width="0.75" stroke-dasharray="2 1.5"/>

