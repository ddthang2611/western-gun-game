<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="25%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="75%" stop-color="#ff8f00"/>
      <stop offset="100%" stop-color="#b26a00"/>
    </linearGradient>
    <linearGradient id="woodPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3e2723"/>
      <stop offset="50%" stop-color="#271406"/>
      <stop offset="100%" stop-color="#140a03"/>
    </linearGradient>
    <filter id="logoDropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Wooden Badge Plate -->
  <rect x="10" y="10" width="380" height="100" rx="14" fill="url(#woodPlate)" stroke="#8d6e63" stroke-width="3" filter="url(#logoDropShadow)"/>
  <rect x="16" y="16" width="368" height="88" rx="10" fill="none" stroke="#d7ccc8" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.4"/>

  <!-- Left Star Badge -->
  <g transform="translate(42, 60) scale(0.42)">
    <polygon points="0,-44 11,-15 42,-14 17,6 26,36 0,18 -26,36 -17,6 -42,-14 -11,-15" fill="url(#logoGold)" stroke="#3e2723" stroke-width="3"/>
    <circle cx="0" cy="0" r="10" fill="#24140a" stroke="url(#logoGold)" stroke-width="2"/>
  </g>

  <!-- Right Star Badge -->
  <g transform="translate(358, 60) scale(0.42)">
    <polygon points="0,-44 11,-15 42,-14 17,6 26,36 0,18 -26,36 -17,6 -42,-14 -11,-15" fill="url(#logoGold)" stroke="#3e2723" stroke-width="3"/>
    <circle cx="0" cy="0" r="10" fill="#24140a" stroke="url(#logoGold)" stroke-width="2"/>
  </g>

  <!-- Header Main Title -->
  <text x="200" y="62" font-family="'Rye', 'Playfair Display', 'Georgia', serif" font-size="34" font-weight="900" letter-spacing="4" text-anchor="middle" fill="url(#logoGold)" stroke="#3e2723" stroke-width="1.5" filter="url(#logoDropShadow)">
    WESTERN GUN
  </text>

  <!-- Subtitle Ribbon -->
  <text x="200" y="86" font-family="'Courier New', monospace" font-size="11" font-weight="bold" letter-spacing="5" text-anchor="middle" fill="#d7ccc8" opacity="0.85">
    WILD WEST CARD GAME
  </text>
</svg>
